# Production is the canonical destination for Auth confirmation links. Keep
# local URLs only as explicit development allow-list entries.
[auth]
site_url = "https://paysme.site"
additional_redirect_urls = [
  "https://paysme.site/auth",
  "https://www.paysme.site/auth",
  "http://localhost:8080/auth",
  "http://localhost:8081/auth",
  "http://127.0.0.1:8080/auth",
  "http://127.0.0.1:8081/auth"
]

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your PaySME merchant account"
content_path = "./supabase/templates/confirmation.html"

